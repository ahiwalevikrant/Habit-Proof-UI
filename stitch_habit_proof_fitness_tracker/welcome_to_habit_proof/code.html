<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Habit-proof | Access Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

          extend: {
            "colors": {
                    "tertiary-fixed-dim": "#ffb95f",

                    "on-secondary-fixed-variant": "#005236",
                    "primary-container": "#ff570e",
                    "on-tertiary-fixed-variant": "#653e00",
                    "outline-variant": "#5c4037",
                    "primary-fixed-dim": "#ffb59d",
                    "on-primary-container": "#511500",
                    "surface-container": "#201f21",
                    "inverse-on-surface": "#303032",
                    "on-error-container": "#ffdad6",
                    "on-primary-fixed": "#390c00",
                    "surface-tint": "#ffb59d",
                    "inverse-surface": "#e5e1e4",
                    "on-primary-fixed-variant": "#832700",
                    "on-secondary-fixed": "#002113",
                    "tertiary-fixed": "#ffddb8",
                    "on-primary": "#5d1900",
                    "surface-container-lowest": "#0e0e10",
                    "surface-container-highest": "#353437",
                    "inverse-primary": "#ab3500",
                    "tertiary-container": "#ca8100",
                    "on-secondary-container": "#00311f",
                    "error-container": "#93000a",
                    "on-surface-variant": "#e5beb2",
                    "on-error": "#690005",
                    "on-tertiary-fixed": "#2a1700",
                    "secondary-container": "#00a572",
                    "on-secondary": "#003824",
                    "secondary": "#4edea3",
                    "outline": "#ac897e",
                    "secondary-fixed": "#6ffbbe",
                    "surface-variant": "#353437",
                    "surface": "#131315",
                    "tertiary": "#ffb95f",
                    "on-background": "#e5e1e4",
                    "secondary-fixed-dim": "#4edea3",
                    "on-surface": "#e5e1e4",
                    "on-tertiary": "#472a00",
                    "error": "#ffb4ab",
                    "primary": "#ffb59d",
                    "primary-fixed": "#ffdbd0",
                    "surface-dim": "#131315",
                    "surface-bright": "#39393b",
                    "on-tertiary-container": "#3e2400",
                    "surface-container-high": "#2a2a2c",
                    "surface-container-low": "#1b1b1d"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "sm": "8px",
                    "xs": "4px",
                    "container-margin": "20px",
                    "md": "16px",
                    "lg": "24px",
                    "unit": "4px",
                    "xl": "32px",
                    "gutter": "16px"
            },
            "fontFamily": {
                    "body-lg": ["Inter"],
                    "headline-lg": ["Outfit"],
                    "headline-lg-mobile": ["Outfit"],

                    "label-bold": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}]

          },
        },
      }

<style>
        .glass-card {
            background: rgba(32, 31, 33, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(42, 42, 48, 0.5);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .input-glow:focus {
            outline: none;
            border-color: #ff570e;
            box-shadow: 0 0 10px rgba(255, 87, 14, 0.3);
        }

        .primary-glow {
            box-shadow: 0 4px 20px rgba(252, 82, 0, 0.4);
        }

        .animated-bg-gradient {
            background: radial-gradient(circle at 50% 50%, #1a1a1c 0%, #131315 100%);
            position: fixed;
            inset: 0;
            z-index: -1;
        }

        .glow-accent {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(252, 82, 0, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(40px);
            pointer-events: none;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md antialiased overflow-hidden">
<!-- Atmospheric Background -->
<div class="animated-bg-gradient"></div>
<div class="glow-accent top-[-100px] left-[-100px]"></div>
<div class="glow-accent bottom-[-100px] right-[-100px]"></div>
<!-- Main Container -->
<div class="flex flex-col items-center justify-center min-h-screen px-container-margin relative z-10">
<!-- Logo Section -->
<header class="mb-lg flex flex-col items-center animate-fade-in">
<div class="mb-md">
<img alt="Habit-proof Logo" class="h-12 w-auto" src="https://www.gstatic.com/labs-code/stitch/stitch-placeholder-300x300.svg"/>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg tracking-tighter uppercase">
                HABIT<span class="text-primary-container">PROOF</span>
</h1>
<p class="text-on-surface-variant text-label-sm uppercase tracking-widest mt-xs opacity-60">Elite Habit Engineering</p>
</header>
<!-- Glassmorphic Auth Card -->
<main class="w-full max-w-md glass-card rounded-xl p-lg animate-slide-up">
<!-- Tabs -->
<div class="flex border-b border-surface-container-highest/30 mb-lg">
<button class="flex-1 pb-md font-label-bold text-label-bold uppercase tracking-wider text-primary border-b-2 border-primary transition-all duration-300" id="login-tab" onclick="switchTab('login')">
                    Log In
                </button>
<button class="flex-1 pb-md font-label-bold text-label-bold uppercase tracking-wider text-on-surface-variant transition-all duration-300" id="signup-tab" onclick="switchTab('signup')">
                    Sign Up
                </button>
</div>
<!-- Login Form -->
<form class="space-y-md" id="auth-form">
<div class="hidden opacity-0 h-0 transition-all duration-300" id="name-field">
<label class="block text-label-bold text-on-surface-variant uppercase mb-xs ml-unit">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant">person</span>
<input class="w-full bg-surface-container-lowest border border-surface-container-highest/50 rounded-lg py-3 pl-12 pr-md text-on-surface font-body-md input-glow transition-all" placeholder="Alex Rivers" type="text"/>
</div>
</div>
<div>
<label class="block text-label-bold text-on-surface-variant uppercase mb-xs ml-unit">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant">mail</span>
<input class="w-full bg-surface-container-lowest border border-surface-container-highest/50 rounded-lg py-3 pl-12 pr-md text-on-surface font-body-md input-glow transition-all" placeholder="alex@habitproof.com" type="email"/>
</div>
</div>
<div>
<label class="block text-label-bold text-on-surface-variant uppercase mb-xs ml-unit">Secret Key</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
<input class="w-full bg-surface-container-lowest border border-surface-container-highest/50 rounded-lg py-3 pl-12 pr-md text-on-surface font-body-md input-glow transition-all" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="pt-sm">
<button class="w-full bg-primary-container text-on-primary-container font-headline-md text-headline-md py-4 rounded-xl primary-glow active:scale-95 transition-all duration-200 flex items-center justify-center gap-sm" type="submit">
                        Access Dashboard
                        <span class="material-symbols-outlined">bolt</span>
</button>
</div>
</form>
<!-- Social/Secondary Auth -->
<div class="mt-lg">
<div class="flex items-center gap-md mb-md">
<div class="h-px flex-1 bg-surface-container-highest/30"></div>
<span class="text-label-sm text-on-surface-variant uppercase">Biometric Link</span>
<div class="h-px flex-1 bg-surface-container-highest/30"></div>
</div>
<button class="w-full bg-surface-container-high border border-surface-container-highest/50 text-on-surface font-label-bold text-label-bold uppercase py-3 rounded-lg flex items-center justify-center gap-sm hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined">fingerprint</span>
                    Fast Pass Login
                </button>
</div>
</main>
<!-- Bottom Footer Info -->
<footer class="mt-lg text-center animate-fade-in opacity-50">
<p class="text-label-sm text-on-surface-variant flex items-center gap-xs justify-center">
<span class="material-symbols-outlined text-[14px]">verified_user</span>
                Secure Athletic Data Protocol v2.4
            </p>
</footer>
</div>
<!-- Scripts -->
<script>
        function switchTab(type) {
            const loginTab = document.getElementById('login-tab');
            const signupTab = document.getElementById('signup-tab');
            const nameField = document.getElementById('name-field');
            const submitBtn = document.querySelector('button[type="submit"]');

            if (type === 'signup') {
                signupTab.classList.add('text-primary', 'border-primary', 'border-b-2');
                signupTab.classList.remove('text-on-surface-variant');
                loginTab.classList.remove('text-primary', 'border-primary', 'border-b-2');
                loginTab.classList.add('text-on-surface-variant');
                
                nameField.classList.remove('hidden', 'opacity-0', 'h-0');
                nameField.classList.add('opacity-100', 'h-auto', 'mb-md');
                submitBtn.innerHTML = 'Create Account <span class="material-symbols-outlined">person_add</span>';
            } else {
                loginTab.classList.add('text-primary', 'border-primary', 'border-b-2');
                loginTab.classList.remove('text-on-surface-variant');
                signupTab.classList.remove('text-primary', 'border-primary', 'border-b-2');
                signupTab.classList.add('text-on-surface-variant');
                
                nameField.classList.add('hidden', 'opacity-0', 'h-0');
                nameField.classList.remove('opacity-100', 'h-auto', 'mb-md');
                submitBtn.innerHTML = 'Access Dashboard <span class="material-symbols-outlined">bolt</span>';
            }
        }

        // Simple form interaction
        document.getElementById('auth-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Authenticating...';
            btn.classList.add('opacity-80');
            
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Granted';
                btn.classList.remove('bg-primary-container');
                btn.classList.add('bg-secondary-container', 'text-on-secondary-container');
            }, 1500);
        });
    </script>
<style>
        @keyframes slide-up {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-slide-up {
            animation: slide-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .animate-fade-in {
            animation: fade-in 1s ease-out forwards;
        }
        .animate-spin {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</body></html>
